services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-86400}
      - OUTPUT_DIR=/app/output
      - PROXY_URL=${PROXY_URL:-}
      - STEALTH_MODE=${STEALTH_MODE:-true}
      - BROWSER_POOL_SIZE=${BROWSER_POOL_SIZE:-3}
      - EXTRACT_WORKERS=${EXTRACT_WORKERS:-}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-60}
      - CRAWL_CONCURRENCY=${CRAWL_CONCURRENCY:-10}
      - CRAWL_RATE_PER_SEC=${CRAWL_RATE_PER_SEC:-10}
      - SEARCH_ENGINE=${SEARCH_ENGINE:-google}
      - SEARCH_FALLBACK=${SEARCH_FALLBACK:-true}
      - SEARCH_CACHE_TTL_SECONDS=${SEARCH_CACHE_TTL_SECONDS:-3600}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
